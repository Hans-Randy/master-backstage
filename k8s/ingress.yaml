apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage-app
spec:
  rules:
  - host: "backstage-app.test.com"
    http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backstage-app
              port:
                number: 8080
